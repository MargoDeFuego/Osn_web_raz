<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lab 3 — Валидация формы</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <h1>Мой сайт</h1>
  <button id="open-modal">Регистрация</button>
</header>

<dialog id="reg-dialog">
  <form id="reg-form" novalidate>
    <h2>Регистрация</h2>

    <!-- Имя -->
    <label>
      Имя (обязательно)
      <input 
        id="name"
        name="name"
        type="text"
        required
        minlength="2"
        aria-describedby="name-error"
      >
    </label>
    <div id="name-error" class="error" aria-live="polite" hidden></div>

    <!-- Почта -->
    <label>
      Почта (обязательно)
      <input 
        id="email"
        name="email"
        type="email"
        required
        aria-describedby="email-error"
      >
    </label>
    <div id="email-error" class="error" aria-live="polite" hidden></div>

    <!-- Пароль -->
    <label>
      Пароль (минимум 6 символов)
      <input 
        id="password"
        name="password"
        type="password"
        required
        minlength="6"
        aria-describedby="password-error"
      >
    </label>
    <div id="password-error" class="error" aria-live="polite" hidden></div>

    <div class="buttons">
      <button type="submit">Отправить</button>
      <button type="button" id="show-pass">Показать пароль</button>
      <button type="button" id="close-modal">Закрыть</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
